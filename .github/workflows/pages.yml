# Static site only. Python inference stays on the separately hosted API.
# The github-pages environment must explicitly allow the release branch.
name: pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage and check the static site
        run: |
          mkdir -p _site
          cp -a docs/launch/. _site/
          cp docs/ecosystem.html _site/ecosystem.html
          touch _site/.nojekyll
          python deployment/check_pages.py _site
      - uses: actions/upload-artifact@v4
        with:
          name: launch-site
          path: _site
      - uses: actions/upload-pages-artifact@v3
        if: >-
          (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
          (github.event_name == 'workflow_dispatch' &&
           (github.ref == 'refs/heads/main' ||
            github.ref == 'refs/heads/arena/01a0cc04-wt-pm-lstm-scada-anomaly'))
        with:
          path: _site

  deploy:
    needs: build
    if: >-
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' &&
       (github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/arena/01a0cc04-wt-pm-lstm-scada-anomaly'))
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages-deployment
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
