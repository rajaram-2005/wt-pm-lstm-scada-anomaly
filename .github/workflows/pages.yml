name: pages
on:
  push:
    branches: [main, arena/01a0c317-wt-pm-lstm-scada-anomaly]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: stage launch site at /
        run: |
          mkdir -p _site
          cp -a docs/launch/. _site/
          cp docs/ecosystem.html _site/ecosystem.html || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
