name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          pip install -e . pytest numpy pandas scikit-learn
          pip install -e platform
      - name: model-13 tests
        run: python -m pytest tests -q
      - name: platform tests
        run: python -m pytest platform/tests --tb=short
