# Tokenless PyPI via Trusted Publishing (OIDC).
# One-time: PyPI → Publishing → Add pending publisher
#   owner: rajaram-2005
#   repo:  wt-pm-lstm-scada-anomaly
#   workflow: publish.yml
#   environment: pypi
name: publish
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: build sdist/wheel from platform/
        run: |
          pip install build
          python -m build platform
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: platform/dist
